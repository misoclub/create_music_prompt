<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>音楽プロンプトコピー</title>
    <meta
      name="description"
      content="JSONに保存した音楽スタイルから、AIに投げるプロンプトを作るページ"
    />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <nav class="music-tabs" aria-label="音楽タイプ" role="tablist">
      <button
        class="music-tab"
        type="button"
        role="tab"
        aria-selected="true"
        data-prompt-source="india"
      >
        インド音楽
      </button>
      <button
        class="music-tab"
        type="button"
        role="tab"
        aria-selected="false"
        data-prompt-source="japan"
      >
        日本音楽
      </button>
    </nav>

    <main class="app-layout">
      <section class="styles-panel" aria-labelledby="stylesTitle">
        <div class="section-heading">
          <h2 id="stylesTitle">スタイル一覧</h2>
          <span class="meta-label" id="styleCount"></span>
        </div>
        <div class="mobile-style-picker">
          <details class="mobile-style-details" id="mobileStyleDetails">
            <summary class="mobile-style-summary">
              <span class="mobile-selected-title" id="mobileSelectedTitle"></span>
              <span class="mobile-selected-description" id="mobileSelectedDescription"></span>
              <span class="mobile-selected-inspired" id="mobileSelectedInspired"></span>
            </summary>
            <div class="mobile-style-options" id="mobileStyleOptions"></div>
          </details>
        </div>
        <div class="style-list" id="styleList"></div>
      </section>

      <section class="output-panel" aria-label="生成プロンプト">
        <div class="japan-options" id="japanOptions" hidden>
          <div class="field-control">
            <label for="songTitleInput">歌のタイトル</label>
            <input id="songTitleInput" type="text" placeholder="例: 雨の中の小さな声" />
          </div>

          <div class="field-control">
            <label for="durationSelect">曲の長さ</label>
            <select id="durationSelect" aria-label="曲の長さ">
              <option value="1">1分以内</option>
              <option value="2">2分以内</option>
              <option value="3" selected>3分以内</option>
              <option value="4">4分以内</option>
              <option value="5">5分以内</option>
            </select>
          </div>

          <div class="field-control">
            <label for="themeInput">テーマ</label>
            <textarea
              id="themeInput"
              rows="2"
              placeholder="例: モラハラを受けている女の子の悲しい歌"
            ></textarea>
            <p class="field-help">例: モラハラを受けている女の子の悲しい歌</p>
          </div>
        </div>

        <div class="prompt-block lyrics-block">
          <div class="output-toolbar">
            <div>
              <h2>歌詞生成用プロンプト</h2>
              <p class="meta-label" id="selectedTitle"></p>
            </div>
            <button class="copy-button" id="copyLyricsButton" type="button">
              <span aria-hidden="true">⧉</span>
              コピー
            </button>
          </div>
          <textarea
            id="lyricsPromptOutput"
            class="prompt-output"
            spellcheck="false"
            aria-label="歌詞生成用プロンプト"
          ></textarea>
        </div>

        <div class="prompt-block suno-block">
          <div class="output-toolbar">
            <div>
              <h2>Suno用プロンプト</h2>
              <p class="meta-label">JSONのpromptをそのまま表示</p>
            </div>
            <button class="copy-button" id="copySunoButton" type="button">
              <span aria-hidden="true">⧉</span>
              コピー
            </button>
          </div>
          <textarea
            id="sunoPromptOutput"
            class="prompt-output"
            spellcheck="false"
            aria-label="Suno用プロンプト"
          ></textarea>
        </div>

        <div class="prompt-block thumbnail-block">
          <div class="output-toolbar">
            <div>
              <h2>サムネイル用プロンプト</h2>
              <p class="meta-label">固定文言</p>
            </div>
            <button class="copy-button" id="copyThumbnailButton" type="button">
              <span aria-hidden="true">⧉</span>
              コピー
            </button>
          </div>
          <textarea
            id="thumbnailPromptOutput"
            class="prompt-output"
            spellcheck="false"
            readonly
            aria-label="サムネイル用プロンプト"
          ></textarea>
        </div>

        <p class="status-line" id="statusLine" role="status" aria-live="polite"></p>
      </section>
    </main>

    <template id="emptyTemplate">
      <div class="empty-state"></div>
    </template>

    <script src="./js/app.js" type="module"></script>
  </body>
</html>
