<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>音楽プロンプトコピー</title>
    <meta
      name="description"
      content="JSONに保存した音楽スタイルから、AIに投げるプロンプトを作るページ"
    />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <main class="app-layout">
      <section class="styles-panel" aria-labelledby="stylesTitle">
        <div class="section-heading">
          <h2 id="stylesTitle">スタイル一覧</h2>
          <span class="meta-label" id="styleCount"></span>
        </div>
        <div class="mobile-style-picker">
          <details class="mobile-style-details" id="mobileStyleDetails">
            <summary class="mobile-style-summary">
              <span class="mobile-selected-title" id="mobileSelectedTitle"></span>
              <span class="mobile-selected-description" id="mobileSelectedDescription"></span>
            </summary>
            <div class="mobile-style-options" id="mobileStyleOptions"></div>
          </details>
        </div>
        <div class="style-list" id="styleList"></div>
      </section>

      <section class="output-panel" aria-label="生成プロンプト">
        <div class="prompt-block lyrics-block">
          <div class="output-toolbar">
            <div>
              <h2>歌詞生成用プロンプト</h2>
              <p class="meta-label" id="selectedTitle"></p>
            </div>
            <button class="copy-button" id="copyLyricsButton" type="button">
              <span aria-hidden="true">⧉</span>
              コピー
            </button>
          </div>
          <textarea
            id="lyricsPromptOutput"
            class="prompt-output"
            spellcheck="false"
            aria-label="歌詞生成用プロンプト"
          ></textarea>
        </div>

        <div class="prompt-block suno-block">
          <div class="output-toolbar">
            <div>
              <h2>Suno用プロンプト</h2>
              <p class="meta-label">JSONのpromptをそのまま表示</p>
            </div>
            <button class="copy-button" id="copySunoButton" type="button">
              <span aria-hidden="true">⧉</span>
              コピー
            </button>
          </div>
          <textarea
            id="sunoPromptOutput"
            class="prompt-output"
            spellcheck="false"
            aria-label="Suno用プロンプト"
          ></textarea>
        </div>

        <p class="status-line" id="statusLine" role="status" aria-live="polite"></p>
      </section>
    </main>

    <template id="emptyTemplate">
      <div class="empty-state"></div>
    </template>

    <script src="./js/app.js" type="module"></script>
  </body>
</html>
