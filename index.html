<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Music Prompt Builder</title>
    <meta
      name="description"
      content="JSONから音楽生成AI向けのプロンプトを作成する静的Webページ"
    />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div>
        <p class="eyebrow">JSON Prompt Tool</p>
        <h1>Music Prompt Builder</h1>
      </div>
      <button class="icon-button" id="reloadButton" type="button" aria-label="JSONを再読み込み">
        <span aria-hidden="true">↻</span>
      </button>
    </header>

    <main class="app-layout">
      <section class="controls-panel" aria-labelledby="controlsTitle">
        <div class="section-heading">
          <h2 id="controlsTitle">プリセット</h2>
          <span id="configName" class="meta-label"></span>
        </div>
        <div class="preset-grid" id="presetGrid"></div>

        <div class="section-heading form-heading">
          <h2>条件</h2>
          <button class="text-button" id="resetButton" type="button">初期値に戻す</button>
        </div>
        <form id="promptForm" class="prompt-form"></form>
      </section>

      <section class="output-panel" aria-labelledby="outputTitle">
        <div class="output-toolbar">
          <div>
            <h2 id="outputTitle">生成プロンプト</h2>
            <p id="promptStats" class="meta-label"></p>
          </div>
          <button class="copy-button" id="copyButton" type="button">
            <span aria-hidden="true">⧉</span>
            コピー
          </button>
        </div>
        <textarea id="promptOutput" spellcheck="false" aria-label="生成されたプロンプト"></textarea>
        <p class="status-line" id="statusLine" role="status" aria-live="polite"></p>
      </section>
    </main>

    <template id="loadingTemplate">
      <div class="empty-state">読み込み中...</div>
    </template>

    <script src="./js/app.js" type="module"></script>
  </body>
</html>
